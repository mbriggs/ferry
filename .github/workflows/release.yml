name: release

# Every push to main (a merge) is tested, then released as the next patch
# version: v0.1.0, v0.1.1, ... To bump the minor or major version, push a
# tag like v0.2.0 by hand; the next release counts up from it.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: next version
        id: version
        run: |
          if tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1) && [ -n "$tag" ]; then
            echo "HEAD is already tagged $tag"
          else
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
            if [ -z "$last" ]; then
              tag=v0.1.0
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              tag="v$major.$minor.$((patch + 1))"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.version.outputs.tag }}
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
