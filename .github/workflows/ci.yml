name: ci

on:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The laptop is a Mac and kant is Linux; both sides run these tests.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Handoffs need rsync 3.2.5+; macOS ships openrsync instead.
      - name: rsync
        if: runner.os == 'macOS'
        run: brew install rsync && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: test/worktree.sh
      - run: make dist
